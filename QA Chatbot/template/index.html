<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>FAQ Chatbot</title>

    <style>

        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: Arial, sans-serif;
            background: #efeae2;
        }

        /* =========================
           FULL PAGE CHAT CONTAINER
        ========================== */

        .chat-container {
            width: 100vw;
            height: 100vh;

            margin: 0;
            padding: 0;

            background: white;

            display: flex;
            flex-direction: column;

            overflow: hidden;
        }

        /* =========================
           HEADER
        ========================== */

        .chat-header {
            width: 100%;
            height: 70px;

            background: #075e54;
            color: white;

            display: flex;
            align-items: center;

            padding: 0 30px;

            flex-shrink: 0;
        }

        .chat-header h2 {
            margin: 0;
            font-size: 20px;
        }

        .chat-header p {
            margin: 3px 0 0;
            font-size: 12px;
            opacity: 0.8;
        }

        /* =========================
           CHAT BODY
        ========================== */

        .chat-body {
            flex: 1;

            width: 100%;

            padding: 25px 40px;

            overflow-y: auto;
            overflow-x: hidden;

            background: #efeae2;

            scroll-behavior: smooth;

            direction: ltr;
        }

        /* =========================
           SCROLLBAR
        ========================== */

        .chat-body::-webkit-scrollbar {
            width: 7px;
        }

        .chat-body::-webkit-scrollbar-thumb {
            background: #aaa;
            border-radius: 10px;
        }

        .chat-body::-webkit-scrollbar-track {
            background: transparent;
        }

        /* =========================
           MESSAGE
        ========================== */

        .message {
            display: block;

            width: fit-content;

            max-width: 65%;

            padding: 10px 14px;

            margin-top: 0;
            margin-bottom: 14px;

            border-radius: 10px;

            font-size: 15px;

            line-height: 21px;

            word-break: break-word;
            overflow-wrap: break-word;

            white-space: normal;

            text-align: left;

            direction: ltr;
        }

        /* =========================
           USER MESSAGE
        ========================== */

        .message.user {
            margin-left: auto;
            margin-right: 0;

            background: #d9fdd3;

            border-top-right-radius: 5px;

            text-align: left;

            direction: ltr;
        }

        /* =========================
           BOT MESSAGE
        ========================== */

        .message.bot {
            margin-left: 0;
            margin-right: auto;

            background: white;

            border-top-left-radius: 5px;

            text-align: left;

            direction: ltr;
        }

        /* =========================
           FOOTER
        ========================== */

        .chat-footer {
            width: 100%;

            padding: 14px 30px;

            background: #f0f2f5;

            flex-shrink: 0;
        }

        /* =========================
           FORM
        ========================== */

        .chat-form {
            width: 100%;

            display: flex;

            align-items: center;

            gap: 12px;

            direction: ltr;
        }

        /* =========================
           INPUT
        ========================== */

        .chat-form input {
            flex: 1;

            width: 100%;

            height: 48px;

            border: none;

            outline: none;

            padding: 10px 18px;

            border-radius: 25px;

            font-size: 15px;

            background: white;

            text-align: left;

            direction: ltr;
        }

        /* =========================
           SEND BUTTON
        ========================== */

        .chat-form button {
            width: 50px;
            height: 50px;

            min-width: 50px;

            border: none;

            border-radius: 50%;

            background: #075e54;

            cursor: pointer;

            display: flex;

            align-items: center;

            justify-content: center;

            transition: 0.2s;
        }

        .chat-form button:hover {
            background: #064e46;

            transform: scale(1.05);
        }

        /* =========================
           SEND ICON
        ========================== */

        .whatsapp-send-icon {
            width: 24px;
            height: 24px;
            display: block;
        }

    </style>

</head>


<body>

    <div class="chat-container">


        <!-- =========================
             HEADER
        ========================== -->

        <div class="chat-header">

            <div>

                <h2>FAQ Chatbot</h2>

                <p>Online</p>

            </div>

        </div>


        <!-- =========================
             CHAT BODY
        ========================== -->

        <div class="chat-body" id="chatBody">

            <!-- Chat History -->

            {% for chat in chats %}

                <!-- User Question -->

                <div class="message user">
                    {{ chat.question }}
                </div>


                <!-- Bot Answer -->

                <div class="message bot">
                    {{ chat.answer }}
                </div>

            {% endfor %}

        </div>


        <!-- =========================
             FOOTER
        ========================== -->

        <div class="chat-footer">

            <form
                action="/predict"
                method="POST"
                class="chat-form"
                id="chatForm"
            >

                <input
                    type="text"
                    name="question"
                    id="question"
                    placeholder="Type a question..."
                    autocomplete="off"
                    autofocus
                    required
                >


                <!-- Send Button -->

                <button
                    type="submit"
                    title="Send"
                >

                    <svg
                        class="whatsapp-send-icon"
                        viewBox="0 0 24 24"
                        xmlns="http://www.w3.org/2000/svg"
                    >

                        <path
                            d="M2.5 21.5L22 12L2.5 2.5L5.5 11L16 12L5.5 13L2.5 21.5Z"
                            fill="white"
                        />

                    </svg>

                </button>

            </form>

        </div>

    </div>


    <!-- =========================
         AUTO SCROLL + AUTO FOCUS
    ========================== -->

    <script>

        const chatBody =
            document.getElementById("chatBody");

        const questionInput =
            document.getElementById("question");


        window.onload = function () {

            // Automatically scroll to bottom
            chatBody.scrollTop =
                chatBody.scrollHeight;


            // Automatically focus input
            questionInput.focus();

        };

    </script>


</body>

</html>
